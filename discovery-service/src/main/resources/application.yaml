server:
  port: 8761

spring:
  application:
    name: discovery-service

eureka:
  instance:
    hostname: localhost # Sử dụng localhost trên máy vật lý
  client:
    register-with-eureka: false # Bản thân server không cần tự đăng ký chính nó
    fetch-registry: false
    service-url:
      defaultZone: http://localhost:8761/eureka/
  server:
    wait-time-in-ms-when-sync-empty: 0
    enable-self-preservation: true