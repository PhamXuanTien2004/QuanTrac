services:
  # ==========================================
  # LAYER 1: DATA & INFRASTRUCTURE SERVICES
  # ==========================================

  # 1. MySQL Server
  mysql-vti:
    image: mysql:8.0
    container_name: mysql-vti
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "123456789"
      MYSQL_ROOT_HOST: "%"
    command: --init-file="/data/application/init-db/init.sql"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-db/init.sql:/data/application/init-db/init.sql
    networks:
      - vti-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p123456789"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Giao diện Web quản trị MySQL (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: iot-phpmyadmin
    ports:
      - "8085:80"
    environment:
      PMA_HOST: mysql-vti
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: "123456789"
    depends_on:
      - mysql-vti
    networks:
      - vti-network

  # 2. Keycloak (Xác thực IAM)
  vti-keycloak:
    image: quay.io/keycloak/keycloak:22.0.5
    container_name: vti-keycloak
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql-vti:3306/keycloak?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      KC_DB_USERNAME: root
      KC_DB_PASSWORD: '123456789'
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: password
    command: start-dev
    ports:
      - "8082:8080"
    depends_on:
      - mysql-vti
    networks:
      - vti-network

  # 3. Redis (Cache & Rate Limiter)
  redis:
    image: redis:7.0-alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - vti-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UI để quản lý Redis trực quan
  redis-insight:
    image: redislabs/redisinsight:1.14.0
    container_name: redis-insight-ui
    ports:
      - "8001:8001"
    volumes:
      - redis-insight-data:/data
    depends_on:
      - redis
    networks:
      - vti-network

  # 4. InfluxDB (Lưu trữ chuỗi thời gian)
  iot-influxdb:
    image: influxdb:2.7-alpine
    container_name: influxdb
    ports:
      - "8086:8086"
    environment:
      - DOCKER_INFLUXDB_INIT_MODE=setup
      - DOCKER_INFLUXDB_INIT_USERNAME=admin
      - DOCKER_INFLUXDB_INIT_PASSWORD=Admin@123
      - DOCKER_INFLUXDB_INIT_ORG=iot_org
      - DOCKER_INFLUXDB_INIT_BUCKET=telemetry_raw
      - DOCKER_INFLUXDB_INIT_RETENTION=30d
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=VHawY3Lk5RSWnd1ctSN9y7kyMDJok3w060EQ8ViD9CsKojzTivD5fYn7-BhM2pfX-ZzWHGi94c8qDyYTfwDMIA==
    volumes:
      - influxdb-data:/var/lib/influxdb2
    networks:
      - vti-network

  # 5. Eclipse Mosquitto (MQTT Broker)
  iot-mosquitto:
    image: eclipse-mosquitto:2
    container_name: iot-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - mosquitto-data:/mosquitto/data
    command: sh -c "mkdir -p /mosquitto/config && echo 'listener 1883' > /mosquitto/config/mosquitto.conf && echo 'allow_anonymous true' >> /mosquitto/config/mosquitto.conf && /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf"
    networks:
      - vti-network

  # 6. Zookeeper (Điều phối Kafka)
  zookeeper:
    container_name: zookeeper
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    networks:
      - vti-network

  # 7. Apache Kafka Broker
  kafka:
    container_name: kafka
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:29092,OUTSIDE://127.0.0.1:9092
      KAFKA_LISTENERS: INSIDE://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
    depends_on:
      - zookeeper
    volumes:
      - kafka-data:/kafka
    networks:
      - vti-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 29092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kafka UI để xem các Topic nghiệp vụ trực quan
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka
    networks:
      - vti-network

  # 8. Elasticsearch
  elasticsearch:
    container_name: vti-elasticsearch
    image: elasticsearch:7.17.10
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - xpack.security.enabled=false
    networks:
      - vti-network

  # 10. Kibana
  kibana:
    container_name: kb-container
    image: kibana:7.17.10
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - vti-network

  # 11. Grafana
  grafana:
    image: grafana/grafana-oss:latest
    container_name: iot-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - iot-influxdb
    networks:
      - vti-network

volumes:
  mysql-data:
  kafka-data:
  redis-data:
  redis-insight-data:
  mosquitto-data:
  influxdb-data:
  grafana-data:

networks:
  vti-network:
    driver: bridge