server:
  port: 8480

spring:
  application:
    name: auth-service
    consumer:
      group-id: auth-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  datasource:
    url: jdbc:mysql://localhost:3307/iot_auth_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: "123456789"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX
    serialization:
      write-dates-as-timestamps: false

client:
  device:
    uri: http://device-service/api/v1

keycloak:
  auth-service-url: http://localhost:8082
  realm: lfs
  resource: quan_trac
  client-id: quan_trac
  admin:
    realm: master
    client-id: admin-cli
    username: admin
    password: password
  credentials:
    secret: YpgWBS8sH2rO1dTJ4KMOMFzYeEARaoft
logging:
  level:
    org.keycloak.admin.client: DEBUG

