server:
  port: 8380

spring:
  application:
    name: ingestion-service

  # ==========================================
  # 1. CẤU HÌNH KAFKA BOOTSTRAP SERVER
  # ==========================================
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      # Sử dụng JsonSerializer để Spring tự chuyển đối tượng Java thành JSON String khi bắn lên Kafka
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  # ==========================================
  # 2. CẤU HÌNH REDIS CACHE
  # ==========================================
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 5000ms

# ==========================================
# 3. CẤU HÌNH MOSQUITTO (MQTT CLIENT)
# ==========================================
mqtt:
  url: tcp://localhost:1883
  client-id: spring_boot_ingestion_client
  topic: iot/telemetry/#
  completion-timeout: 5000

# ==========================================
# 4. CẤU HÌNH INFLUXDB V2
# ==========================================
influxdb:
  url: http://localhost:8086
  org: iot_org
  bucket: telemetry_raw
  token: sK3zgZ73x_W4X4RHy5fvJEVzepz3IyEXfe9_dhoeg5yZ8W1vHuaUzLNavOld3UFzpitpqTJnr67KkwtwIIj9aA==

# ==========================================
# 5. CẤU HÌNH EUREKA CLIENT
# ==========================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

client:
  device:
    uri: http://device-service/api/v1