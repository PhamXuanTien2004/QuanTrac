server:
  port: 8280

spring:
  application:
    name: device-service # Tên định danh dịch vụ đăng ký lên Eureka
  cloud:
    compatibility-verifier:
      enabled: false

  datasource:
    # Lưu ý: Đổi thành 3306 nếu chưa update map port của container Docker thành 3307
    url: jdbc:mysql://localhost:3307/iot_device_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: "123456789"

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/