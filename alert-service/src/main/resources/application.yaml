spring:
  application:
    name: alert-service
  cloud:
    compatibility-verifier:
      enabled: false

    datasource:
      url: jdbc:mysql://localhost:3307/iot_alert_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      username: root
      password: "123456789"

    jpa:
      hibernate:
        ddl-auto: update
      show-sql: true

    jackson:
      time-zone: Asia/Ho_Chi_Minh
      date-format: yyyy-MM-dd'T'HH:mm:ss.SSSXXX

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/


